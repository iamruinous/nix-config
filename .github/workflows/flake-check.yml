# Disabled: Takes too long to run and not currently adding value
# To re-enable, remove the 'if: false' line from the job
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Nix targets
    if: false  # Disabled - see comment at top of file
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free up disk space 
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'holster'
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Cache Nix
        uses: DeterminateSystems/flakehub-cache-action@v2
      - name: Check nix
        uses: DeterminateSystems/flake-checker-action@v12
      - name: Check flake
        run: nix flake check
