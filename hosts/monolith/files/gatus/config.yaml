storage:
  type: sqlite
  path: /data/gatus.db

ui:
  title: "Meskill Farm Status"
  header: "Service Status"

alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    default-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
      description: "Health check failed"

  email:
    from: "${ALERT_EMAIL_FROM}"
    host: "${SMTP_HOST}"
    port: ${SMTP_PORT}
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    to: "${ALERT_EMAIL_TO}"
    default-alert:
      enabled: true
      failure-threshold: 5
      success-threshold: 2
      send-on-resolved: true
      description: "Health check failed"

