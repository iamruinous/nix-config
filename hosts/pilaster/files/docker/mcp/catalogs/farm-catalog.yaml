version: 2
name: farm-catalog
displayName: Meskill Farm Catalog
registry:
  github:
    description: "GitHub repository management, file operations, and GitHub API integration"
    title: "GitHub"
    type: "server"
    image: "ghcr.io/github/github-mcp-server:latest"
    secrets:
      - name: "github.personal_access_token"
        env: "GITHUB_PERSONAL_ACCESS_TOKEN"
        example: "ghp_xxxxxxxxxxxx"
    metadata:
      category: "development"
      tags: ["github", "git", "repositories", "issues", "pull-requests"]
    source: "https://github.com/github/github-mcp-server"
  gemini-api-docs:
    description: "Search and retrieve Google Gemini API documentation"
    title: "Gemini API Docs"
    type: "server"
    image: "mcp/gemini-api-docs-mcp:latest"
    metadata:
      category: "documentation"
      tags: ["gemini", "google", "api", "docs", "documentation"]
    source: "https://github.com/philschmid/gemini-api-docs-mcp"
  google-flights:
    description: "Search flights across date ranges and find round-trip options"
    title: "Google Flights"
    type: "server"
    image: "mcp/google-flights:latest"
    metadata:
      category: "travel"
      tags: ["flights", "travel", "google", "search"]
    source: "https://github.com/kgprs/Google-Flights-MCP-Server"
